# Alembic configuration for the Anvex backend.
#
# Run from `backend/`:   uv run alembic upgrade head
#                        uv run alembic revision --autogenerate -m "add stocks"
#
# There is deliberately no `sqlalchemy.url` here. The one source of configuration is the
# repo-root `.env` (CLAUDE.md §2), which `app/db/migrations/env.py` reads through
# `app.settings.get_settings()`. Anything else would be a second place to configure the
# database, and the two would drift.

[alembic]
# Relative to this file's directory (`backend/`).
script_location = app/db/migrations

# `app` must be importable when alembic runs from `backend/`.
prepend_sys_path = .

# Migrations sort by filename, so lead with the timestamp.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

path_separator = os


# Lint newly generated revisions with the same ruff config as the rest of the backend, so
# an autogenerated file lands clean (unused `sa` import removed, imports sorted).
[post_write_hooks]
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME


# ----------------------------------------------------------------------- logging

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
