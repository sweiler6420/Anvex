[project]
name = "anvex-backend"
version = "0.1.0"
description = "Anvex backend — async FastAPI + Celery investment research API."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    # `[email]` pulls in `email-validator`, without which `EmailStr` is just `str`.
    "pydantic[email]",
    "pydantic-settings",
    "celery[redis]",
    "httpx",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    # bcrypt is capped below 4.1 because passlib 1.7.4 — its final release — cannot work
    # with anything newer. passlib probes its bcrypt backend at first use by hashing a
    # >72-byte secret; bcrypt 5.0 turned that silent truncation into a `ValueError`, so
    # `CryptContext(schemes=["bcrypt"])` raises before it can hash anything at all. 4.1
    # separately dropped `bcrypt.__about__`, which passlib reads for the backend version.
    # The cap is compatibility only: `app/utils/security.py` enforces the 72-byte boundary
    # itself, so nothing relies on a particular library's truncation behaviour.
    "bcrypt>=4.0,<4.1",
    "python-multipart",
    "aioboto3",
    "structlog",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
    "faker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
