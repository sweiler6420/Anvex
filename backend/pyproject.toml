[project]
name = "anvex-backend"
version = "0.1.0"
description = "Anvex backend — async FastAPI + Celery investment research API."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    # `[email]` pulls in `email-validator`, without which `EmailStr` is just `str`.
    "pydantic[email]",
    "pydantic-settings",
    "celery[redis]",
    "httpx",
    "python-jose[cryptography]",
    # Called directly by `app/utils/security.py` (ANV-42). Unpinned so it tracks its
    # maintained line — the cap this once needed existed only for passlib, which is gone.
    "bcrypt",
    "python-multipart",
    "aioboto3",
    "structlog",
    # `app/domain/ingest.py` resolves the exchange's timezone with `zoneinfo`. Windows ships
    # no IANA database, so `ZoneInfo("US/Eastern")` there depends entirely on this package.
    # It arrives transitively via celery today; depended on directly because without it the
    # trading-hours rule is *wrong* rather than absent.
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
    "faker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# RUF001/RUF002 flag "ambiguous" Unicode — `Ⅰ` beside `I`, `𝐀` beside `A`, `٣` beside `3`.
# Those confusables are the *subject* of ANV-43's password policy: the rules are written with
# `unicodedata` precisely so a capital `Ä` counts and a Roman numeral does not, and the tests
# have to spell the characters out to prove it. Ignored in these two files and nowhere else —
# anywhere else, a confusable in a string really is a typo.
"app/domain/password.py" = ["RUF002"]
"tests/unit/test_domain_password.py" = ["RUF001", "RUF002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
