<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      ANV-28. The `anvex-theme-pre-paint` plugin in vite.config.js replaces the marker below
      with a blocking inline script that puts `light` or `dark` on <html> before the body is
      parsed. Without it a dark-mode user sees Tailwind's unclassed light default until
      React mounts and ThemeProvider's effect runs — a flash of white on every cold load.

      It is injected rather than written out here so the storage key and the "a stored
      choice wins, otherwise follow the OS" rule have exactly one home
      (src/providers/themeStorage.js), which ThemeProvider imports as well. Two copies that
      disagreed would make the page *flip* on mount, which is worse than the flash.

      The marker is not optional: injectThemePrePaintScript() throws when it is missing, so
      deleting this line fails the build rather than silently shipping the flash back.
    -->
    <!--anvex:theme-pre-paint-->
    <!-- SVG favicon first: browsers cache a stale .ico far more aggressively. -->
    <link rel="icon" type="image/svg+xml" href="/anvex-favicon.svg" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0891b2" />
    <meta name="description" content="Anvex — investment research platform." />
    <!-- Poppins is the `font-base` family in tailwind.config.js; RTFont is self-hosted
         from /public/fonts and declared in src/styles/index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap"
    />
    <title>Anvex</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
