# Anvex local development stack.
#
# Every service reads the **single repo-root `.env`** (CLAUDE.md §2) via `env_file`.
# There is deliberately no per-stack env file: one file, one source of truth, and every
# new key lands in `.env.example` in the same commit.
#
# `env_file` injects the file into the container; `${VAR}` interpolation in *this* file
# is a separate mechanism that Compose serves from the same `.env`. Where a service needs
# a value that differs from the shared default (the test database name, in-network
# hostnames) an explicit `environment:` entry overrides `env_file`.
#
# Usage:
#   docker compose up -d db redis minio minio-init api   # the working dev stack
#   docker compose up -d db-test                         # backend test database (ANV-6)
#   docker compose --profile celery up -d worker beat    # Celery worker + scheduler (ANV-21)
#   docker compose --profile frontend up -d web          # Vite dev server on :5173 (ANV-23)
#   docker compose down -v                               # stop and drop volumes

name: anvex

services:
  # ------------------------------------------------------------------ Postgres (dev)
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      # The API talks to `db` over the compose network; the entrypoint only reads
      # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB, all of which come from .env.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Not 5432 by default: a natively-installed Postgres commonly owns it, and on
      # Windows both it and the Docker proxy can bind successfully - host clients then
      # silently reach the wrong server. See .env.example.
      - "${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `-U`/`-d` matter: a bare pg_isready reports ready while the entrypoint is still
      # running init scripts on a temporary, socket-only server.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------- Postgres (tests only)
  db-test:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-anvex_test}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_TEST_HOST_PORT:-5433}:5432"
    # No named volume, on purpose. A test database that survives a restart is a test
    # database that carries yesterday's rows into today's assertions. tmpfs means initdb
    # runs on every start and the disk never sees it — which is also considerably faster.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # POSTGRES_DB is overridden above, so this checks the *test* database by name.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    env_file: .env
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # ----------------------------------------------------------------------------- MinIO
  minio:
    image: minio/minio:latest
    env_file: .env
    environment:
      # MinIO's own names for the credentials the app knows as S3_*.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-anvexminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-anvexminio}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # One-shot: create the bucket the app expects, then exit 0. `depends_on` elsewhere uses
  # `service_completed_successfully` to wait for it rather than racing the first upload.
  minio-init:
    image: minio/mc:latest
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    # `$$` escapes Compose interpolation so the *shell inside the container* expands these
    # from the injected env, keeping the credentials out of the rendered compose config.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set anvex "http://minio:9000" "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "anvex/$$S3_BUCKET"
        echo "minio-init: bucket '$$S3_BUCKET' ready"
    restart: "no"

  # ------------------------------------------------------------------------------- API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: anvex/api:dev
    env_file: .env
    environment:
      # In-network hostnames. These already match the .env defaults, but stating them
      # here means a developer who points .env at a host-local Postgres for a moment does
      # not silently break the container.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      # Dev hot-reload. The venv lives at /opt/venv, outside this mount, so the host's
      # Windows-built backend/.venv cannot shadow the container's interpreter.
      - ./backend:/app
    # --reload-dir keeps the watcher off .venv / .pytest_cache, which otherwise costs a
    # few thousand inotify watches for no benefit.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck is inherited from the image: GET /health (liveness, no I/O).
    restart: unless-stopped

  # -------------------------------------------------------------- Celery (ANV-21)
  #
  # `app/jobs/celery_app.py` is the single definition of the broker wiring, the execution
  # policy and the schedule; nothing about any of that is repeated here. These two services
  # differ only in which half of Celery they run: `worker` consumes, `beat` publishes on a
  # timer. Running two `beat` processes would double every scheduled job, so there is
  # exactly one and it is never scaled.
  #
  # They stay behind the `celery` profile: the day-to-day dev stack is the API and its
  # stores, and a worker that is not needed is a container competing for the same Postgres
  # connections. Bring them up with `docker compose --profile celery up -d worker beat`.
  worker:
    profiles: ["celery"]
    image: anvex/api:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    env_file: .env
    healthcheck:
      # The image's own HEALTHCHECK polls /health on :8000 and a worker serves no HTTP, so
      # it is replaced rather than disabled. `inspect ping` goes out over the broker and
      # back, so it answers "this worker is consuming", which is the thing worth knowing —
      # a process that is up but not consuming looks identical from outside. `-d` pins it
      # to *this* container's node so a second worker cannot answer on its behalf.
      test: ["CMD-SHELL", "celery -A app.jobs.celery_app:celery_app inspect ping -d celery@$$(hostname) --timeout 10 >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./backend:/app
    # Prefork is the default pool on Linux and is what the fork rules in `app/db/engine.py`
    # and `app/jobs/base.py` are written for; it is spelled out so that changing it is a
    # decision. `--concurrency 2` keeps a dev worker's Postgres footprint small.
    command:
      - celery
      - -A
      - app.jobs.celery_app:celery_app
      - worker
      - --pool
      - prefork
      - --concurrency
      - "2"
      - --loglevel
      - INFO
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  beat:
    profiles: ["celery"]
    image: anvex/api:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    env_file: .env
    # No healthcheck: beat exposes no inspect interface and consumes nothing, so there is
    # nothing to ask it. Its liveness shows up as the tasks it publishes.
    healthcheck:
      disable: true
    environment:
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
    # `--schedule` is not decoration: beat's shelve file defaults to `celerybeat-schedule`
    # in the working directory, which is the bind-mounted repo — it would write a binary
    # file into the source tree on every start. /tmp is container-local and disposable, and
    # losing it only means the next tick fires immediately.
    command:
      - celery
      - -A
      - app.jobs.celery_app:celery_app
      - beat
      - --schedule
      - /tmp/anvex-celerybeat-schedule
      - --loglevel
      - INFO
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------- Frontend (ANV-23)
  #
  # The Vite dev server. **Node is not installed on the dev host**, so this container is
  # not a convenience — it is where every npm / vite / vitest command runs. See
  # frontend/README.md for the one-liners.
  #
  # It stays behind the `frontend` profile so the day-to-day backend stack is unaffected:
  #   docker compose --profile frontend up -d web
  #
  # `frontend/Dockerfile` installs node_modules at **/node_modules**, one level above the
  # bind mount below — the same argument that puts the backend's venv at /opt/venv. So
  # there is no node_modules volume here, and a dependency change is `up -d --build`
  # rather than a stale volume nobody remembers to remove.
  web:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    image: anvex/web:dev
    env_file: .env
    environment:
      # VITE_* reaches the browser bundle from this file via `env_file`; vite.config.js
      # also points `envDir` at the repo root, which is what covers a run outside compose.
      #
      # The dev proxy target is server-side only, hence no VITE_ prefix: it forwards /v1
      # and /health to the API over the compose network, by service name (CLAUDE.md §4).
      WEB_DEV_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    volumes:
      # Dev hot-reload. /node_modules lives outside this mount, and Vite's own cache goes
      # to /tmp (`cacheDir` in vite.config.js), so nothing is written back to the host tree.
      - ./frontend:/app
    # Healthcheck is inherited from the image: GET / on :5173.
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
